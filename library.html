  }
  setTheme(id) {
    this.setState({ theme: id });
    try { window.localStorage.setItem('ai-console-theme', id); } catch (e) {}
  }
  watchTheme() {
    this._onStorage = e => { if (e.key === 'ai-console-theme' && e.newValue) this.setState({ theme: e.newValue }); };
    try { window.addEventListener('storage', this._onStorage); } catch (e) {}
  }
  themeVals() {
    const cur = ['nebula', 'midnight', 'graphite', 'graphite-dark'].indexOf(this.state.theme) >= 0 ? this.state.theme : 'nebula';
    const sw = (a, b) => `width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(128,128,128,.55);background:linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
    const list = [['nebula', 'Nebula', '#21243D', '#003DFF'], ['midnight', 'Ops Midnight', '#0F1729', '#3D6BF5'], ['graphite', 'Graphite Light', '#E7E5E4', '#4F5BD5'], ['graphite-dark', 'Graphite Dark', '#0B0B0C', '#5560CC']];
    const active = list.find(x => x[0] === cur) || list[0];
    return {
      themeClass: 'th-' + cur, themeName: active[1], themeSwatch: sw(active[2], active[3]),
      themeOpen: !!this.state.themeOpen,
      toggleThemeMenu: () => this.setState({ themeOpen: !this.state.themeOpen }),
      themeKey: e => { if (e.key === 'Escape') this.setState({ themeOpen: false }); },
      themes: list.map(([id, label, a, b]) => {
        const on = cur === id;
        return { label, pressed: on ? 'true' : 'false', check: on ? '✓' : '', swatch: sw(a, b),
          pick: () => { this.setTheme(id); this.setState({ themeOpen: false }); },
          style: `display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);${on ? 'background:var(--accent-soft)' : 'background:transparent'}` };
      })
    };
  }
  state = { theme: this.readTheme(), tab: 'reports', filter: 'All', q: '', pickId: '482193' };

  chip(kind) {
    const c = { blue: 'background:var(--accent-soft);color:var(--accent-text)', amber: 'background:var(--warn-soft);color:var(--warn-text)', teal: 'background:var(--storage-soft);color:var(--storage-text)', gray: 'background:var(--track);color:var(--muted)', red: 'background:var(--danger-soft);color:var(--danger)' }[kind];
    return 'display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;' + c;
  }

  data() {
    return {
      reports: {
        heading: 'Report Library & Dashboard', sub: 'Every report, approved or not. Searchable by the whole support team.', colTitle: 'Diagnosis', colMeta: 'Sources · confidence',
        filters: ['All', 'Approved', 'Corrected', 'Rejected', 'Awaiting review'],
        rows: [
          { ticket: '482193', title: 'Records over the size limit, hidden by client v5.2.0', customer: 'Northwind Retail', status: 'Approved', meta: '6 sources · High', date: 'Today', owner: 'You', summary: '312 records exceed 100 KB after a catalog migration; JS client v5.2.0 did not report rejected batches.', primary: 'Open report' },
          { ticket: '481990', title: 'Synonyms not applied after replica sync', customer: 'Example Outdoor Co.', status: 'Awaiting review', meta: '5 sources · Medium', date: 'Today', owner: 'Not reviewed', summary: 'Standard replica created after the synonym change; synonyms were not forwarded to replicas.', primary: 'Review report' },
          { ticket: '481877', title: 'Personalization scores flat after event schema change', customer: '[CUSTOMER]', status: 'Corrected', meta: '7 sources · Medium', date: 'Yesterday', owner: '[ENGINEER]', summary: 'Events sent without userToken after a front-end release. Correction: affects mobile app only.', primary: 'Open report' },
          { ticket: '481702', title: 'Query latency spike on one cluster', customer: '[CUSTOMER]', status: 'Rejected', meta: '4 sources · Low', date: 'Oct 27', owner: '[ENGINEER]', summary: 'Rejected: the latency came from the customer\'s proxy, which no source covered.', primary: 'Open report' },
          { ticket: '481655', title: 'Facet counts wrong for a filtered attribute', customer: '[CUSTOMER]', status: 'Approved', meta: '5 sources · High', date: 'Oct 27', owner: '[ENGINEER]', summary: 'Attribute declared as filterOnly, so counts were not computed.', primary: 'Open report' },
          { ticket: '481540', title: 'API key 403 after restricting referers', customer: '[CUSTOMER]', status: 'Approved', meta: '3 sources · High', date: 'Oct 26', owner: '[ENGINEER]', summary: 'Referer pattern missed the www subdomain.', primary: 'Open report' }
        ]
      },
      solved: {
        heading: 'Past Solved Cases Store', sub: 'Approved reports only. Provisional until the ticket closes without reopening. Feeds Past Solved Cases Search.', colTitle: 'Resolution', colMeta: 'Used in later cases',
        filters: ['All', 'Provisional', 'Confirmed'],
        rows: [
          { ticket: '482193', title: 'Split or trim oversized records; upgrade client to v5.3.1', customer: 'Northwind Retail', status: 'Provisional', meta: '0 times', date: 'Today', owner: 'You', summary: 'Becomes confirmed when the ticket closes and stays closed.', primary: 'Open case' },
          { ticket: '481877', title: 'Send userToken with every event', customer: '[CUSTOMER]', status: 'Provisional', meta: '1 time', date: 'Yesterday', owner: '[ENGINEER]', summary: 'Waiting for the ticket to close.', primary: 'Open case' },
          { ticket: '481655', title: 'Declare the attribute as searchable for faceting', customer: '[CUSTOMER]', status: 'Confirmed', meta: '3 times', date: 'Oct 27', owner: '[ENGINEER]', summary: 'Closed without reopening.', primary: 'Open case' },
          { ticket: '471020', title: 'Split long descriptions into separate records', customer: '[CUSTOMER]', status: 'Confirmed', meta: '5 times', date: 'Sep 12', owner: '[ENGINEER]', summary: 'Matched by #482193 today.', primary: 'Open case' }
        ]
      },
      gaps: {
        heading: 'Knowledge base gaps', sub: 'Flagged by the KB Gap Check on approved cases. You create or update the article.', colTitle: 'Suggested article', colMeta: 'Match',
        filters: ['All', 'To do', 'Drafting', 'Done'],
        rows: [
          { ticket: '482193', title: 'Batch imports skip records over the size limit without an error', customer: 'Northwind Retail', status: 'To do', meta: 'Partial match', date: 'Today', owner: 'You', summary: 'Existing "size limit" article doesn\'t cover clients hiding rejected batches.', primary: 'Draft article' },
          { ticket: '481877', title: 'Personalization needs userToken on every event', customer: '[CUSTOMER]', status: 'Drafting', meta: 'No match', date: 'Yesterday', owner: '[ENGINEER]', summary: 'No public article covers the event schema change.', primary: 'Continue draft' },
          { ticket: '481540', title: 'Referer restrictions and subdomains', customer: '[CUSTOMER]', status: 'Done', meta: 'Partial match', date: 'Oct 26', owner: '[ENGINEER]', summary: 'Existing article updated with a subdomain example.', primary: 'View article' }
        ]
      }
    };
  }

  componentDidMount() { this.watchTheme(); }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  componentWillUnmount() { try { window.removeEventListener('storage', this._onStorage); } catch (e) {} }

  renderVals() {
    const s = this.state, all = this.data(), view = all[s.tab];
    const kindOf = st => ({ Approved: 'teal', Confirmed: 'teal', Done: 'teal', Corrected: 'blue', Drafting: 'blue', Rejected: 'red', 'Awaiting review': 'amber', Provisional: 'amber', 'To do': 'amber' }[st] || 'gray');
    const q = s.q.trim().toLowerCase();
    const rows = view.rows
      .filter(r => s.filter === 'All' || r.status === s.filter)
      .filter(r => !q || (r.ticket + r.title + r.customer).toLowerCase().includes(q))
      .map(r => ({ ...r, chip: this.chip(kindOf(r.status)), pick: () => this.setState({ pickId: r.ticket }),
        rowStyle: r.ticket === s.pickId ? 'background:var(--surface-2)' : '' }));
    const p = view.rows.find(r => r.ticket === s.pickId) || view.rows[0];
    const tabs = [['reports', 'Report library', ''], ['solved', 'Solved cases', ''], ['gaps', 'KB gaps', '6']];
    const navTabs = tabs.map(([id, label, badge]) => {
      const on = s.tab === id;
      return { label, badge, hasBadge: !!badge, current: on ? 'page' : 'false', selected: on ? 'true' : 'false',
        go: () => this.setState({ tab: id, filter: 'All', pickId: all[id].rows[0].ticket }),
        style: `display:flex;align-items:center;justify-content:space-between;min-height:40px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-size:14px;text-align:left;${on ? 'background:var(--nav-active-bg);color:var(--nav-active-text);font-weight:600' : 'background:transparent;color:var(--nav-text)'}`,
        tabStyle: `min-height:44px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-size:14px;margin-bottom:-1px;border-bottom:2px solid ${on ? 'var(--accent)' : 'transparent'};color:${on ? 'var(--accent-text)' : 'var(--muted)'};font-weight:${on ? 600 : 500}` };
    });
    const filters = view.filters.map(f => {
      const on = s.filter === f;
      return { label: f, pressed: on ? 'true' : 'false', pick: () => this.setState({ filter: f }),
        style: `min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;cursor:pointer;border:1px solid ${on ? 'var(--accent)' : 'var(--border-strong)'};background:${on ? 'var(--accent-soft)' : 'var(--surface)'};color:${on ? 'var(--accent-text)' : 'var(--text)'};font-weight:500` };
    });
    const kpis = [
      { label: 'Reports this month', value: '48', note: 'Demo placeholder' },
      { label: 'Approved first time', value: '81%', note: 'Corrections tracked separately' },
      { label: 'Median time to report', value: '7m 40s', note: 'Intake to report ready' },
      { label: 'Open KB gaps', value: '6', note: '2 partial matches' }
    ];
    return {
      ...this.themeVals(),
      navTabs, filters, kpis, rows, empty: rows.length === 0, q: s.q, onQ: e => this.setState({ q: e.target.value }),
      heading: view.heading, subheading: view.sub, colTitle: view.colTitle, colMeta: view.colMeta,
      pick: { ...p, chip: this.chip(kindOf(p.status)) }
    };
  }
}
</script>
