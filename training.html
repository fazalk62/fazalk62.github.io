  themeVals() {
    const cur = ['nebula', 'midnight', 'graphite', 'graphite-dark'].indexOf(this.state.theme) >= 0 ? this.state.theme : 'nebula';
    const sw = (a, b) => `width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(128,128,128,.55);background:linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
    const list = [['nebula', 'Nebula', '#21243D', '#003DFF'], ['midnight', 'Ops Midnight', '#0F1729', '#3D6BF5'], ['graphite', 'Graphite Light', '#E7E5E4', '#4F5BD5'], ['graphite-dark', 'Graphite Dark', '#0B0B0C', '#5560CC']];
    const active = list.find(x => x[0] === cur) || list[0];
    return {
      themeClass: 'th-' + cur, themeName: active[1], themeSwatch: sw(active[2], active[3]),
      themeOpen: !!this.state.themeOpen,
      toggleThemeMenu: () => this.setState({ themeOpen: !this.state.themeOpen }),
      themeKey: e => { if (e.key === 'Escape') this.setState({ themeOpen: false }); },
      themes: list.map(([id, label, a, b]) => {
        const on = cur === id;
        return { label, pressed: on ? 'true' : 'false', check: on ? '✓' : '', swatch: sw(a, b),
          pick: () => { this.setTheme(id); this.setState({ themeOpen: false }); },
          style: `display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text);${on ? 'background:var(--accent-soft)' : 'background:transparent'}` };
      })
    };
  }
  state = { theme: this.readTheme(), caseId: '482193', step: 0, choice: null, answers: {} };

  data() {
    return [
      { ticket: '482193', title: 'Products missing after batch import', summary: 'New products are missing from search. The import reports success. The customer migrated their catalog last week.', error: '400 · Record at the position 0 objectID=SKU-99812 is too big size=128430/100000 bytes',
        qs: [
          { stage: 'Triage', prompt: 'Which detail would you send back to the engineer before searching?', options: ['The customer\'s plan name', 'The API client and version', 'The storefront URL'], correct: 1, explain: 'Asked for the client version, because batch error handling changed between client releases.', reveal: { mono: 'TP', text: 'Client: algoliasearch JavaScript v5.2.0' } },
          { stage: 'Evidence', prompt: 'Which source best confirms how many records were rejected?', options: ['Slack incidents', 'Mosaic API logs', 'Google Drive runbooks'], correct: 1, explain: 'Checked the Mosaic API logs: 12,407 records rejected with the same 400.', reveal: { mono: 'MO', text: '12,407 records rejected since 13:58 UTC; no 429s' } },
          { stage: 'Diagnosis', prompt: 'Logs show no 429s and 61% of quota used. What does that rule out?', options: ['Quota throttling', 'Oversized records', 'A client bug'], correct: 0, explain: 'Ruled out quota throttling (H2) and kept the other two explanations.', reveal: { mono: 'DD', text: 'H2 quota throttling ruled out' } },
          { stage: 'Diagnosis', prompt: 'Why did the customer think the import succeeded?', options: ['The CDN served cached results', 'Client v5.2.0 resolves batches even when a chunk fails', 'The index was rebuilt overnight'], correct: 1, explain: 'Found in the GitHub changelog: v5.2.0 hid per-chunk errors; fixed in v5.3.1.', reveal: { mono: 'GH', text: 'v5.3.1 surfaces per-chunk batch errors' } },
          { stage: 'Next steps', prompt: 'What is the best first step for the customer?', options: ['Upgrade the plan', 'Trim or split records over 100 KB, then upgrade the client', 'Clear the cache again'], correct: 1, explain: 'Suggested reducing record size first; the client upgrade stops the failure being hidden.', reveal: { mono: 'SK', text: 'Next steps: trim description_html, upgrade to v5.3.1' } }
        ] },
      { ticket: '481655', title: 'Facet counts wrong', summary: 'Facet counts show zero for an attribute the customer filters on.', error: 'No error. Facet counts return 0 for "brand".',
        qs: [
          { stage: 'Triage', prompt: 'Which setting would you check first?', options: ['attributesForFaceting', 'customRanking', 'typoTolerance'], correct: 0, explain: 'Checked attributesForFaceting and found "filterOnly(brand)".', reveal: { mono: 'MO', text: 'attributesForFaceting: filterOnly(brand)' } },
          { stage: 'Diagnosis', prompt: 'What does filterOnly do to facet counts?', options: ['Counts are cached', 'Counts are not computed', 'Counts are rounded'], correct: 1, explain: 'filterOnly lets you filter but doesn\'t compute counts.', reveal: { mono: 'DK', text: 'Docs: filterOnly skips facet counts' } }
        ] },
      { ticket: '481540', title: 'API key 403 after referer rule', summary: 'Search returns 403 on the www subdomain only.', error: '403 · Method not allowed with this referer',
        qs: [
          { stage: 'Evidence', prompt: 'Which detail matters most?', options: ['The referer pattern on the key', 'The index size', 'The client language'], correct: 0, explain: 'Compared the referer pattern with the failing host.', reveal: { mono: 'MO', text: 'Referer pattern: https://example.com/*' } },
          { stage: 'Next steps', prompt: 'What is the fix?', options: ['Create a new app', 'Add the www subdomain to the pattern', 'Disable the key'], correct: 1, explain: 'Suggested adding *.example.com to the allowed referers.', reveal: { mono: 'SK', text: 'Fix: allow *.example.com' } }
        ] }
    ];
  }

  componentDidMount() { this.watchTheme(); }
  componentDidUpdate(prev) { if (prev.theme !== this.props.theme && this.props.theme) this.setTheme(this.props.theme); }
  componentWillUnmount() { try { window.removeEventListener('storage', this._onStorage); } catch (e) {} }

  renderVals() {
    const s = this.state, all = this.data();
    const cs = all.find(c => c.ticket === s.caseId) || all[0];
    const total = cs.qs.length;
    const finished = s.step >= total;
    const q = cs.qs[Math.min(s.step, total - 1)];
    const answered = s.choice !== null;
    const score = Object.values(s.answers).filter(Boolean).length;
    const opts = q.options.map((label, i) => {
      const picked = s.choice === i, right = i === q.correct;
      let border = 'var(--border-strong)', bg = 'var(--surface)', mark = 'background:var(--track);color:var(--muted)';
      if (answered && right) { border = 'var(--storage)'; bg = 'var(--storage-soft)'; mark = 'background:var(--storage);color:var(--on-accent)'; }
      else if (answered && picked) { border = 'var(--danger-border)'; bg = 'var(--danger-soft)'; mark = 'background:var(--danger-solid);color:var(--on-accent)'; }
      return { label, letter: 'ABC'[i], checked: picked ? 'true' : 'false', locked: answered,
        pick: () => this.setState({ choice: i, answers: { ...this.state.answers, [this.state.step]: i === q.correct } }),
        style: `display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text);border:1.5px solid ${border};background:${bg};opacity:1`,
        markStyle: `flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;${mark}` };
    });
    const correct = answered && s.choice === q.correct;
    const revealed = cs.qs.slice(0, s.step + (answered ? 1 : 0)).map(x => x.reveal);
    const stageNames = cs.qs.map(x => x.stage);
    const steps = stageNames.map((label, i) => {
      const done = i < s.step || finished, cur = i === s.step && !finished;
      return { num: String(i + 1), label, style: `flex:1 1 140px;padding:10px 12px;border-radius:10px;font-size:13px;border:1px solid ${cur ? 'var(--accent)' : 'var(--border)'};background:${done ? 'var(--accent-soft)' : cur ? 'var(--surface)' : 'var(--surface-2)'};color:${done || cur ? 'var(--accent-text)' : 'var(--muted)'}` };
    });
    const cases = all.map(c => {
      const on = c.ticket === cs.ticket;
      return { ticket: c.ticket, title: c.title, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ caseId: c.ticket, step: 0, choice: null, answers: {} }),
        style: `display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--nav-text);border:1px solid ${on ? 'var(--nav-hl-border)' : 'var(--nav-border)'};background:${on ? 'var(--nav-hl-bg)' : 'transparent'}` };
    });
    return {
      ...this.themeVals(),
      cs, total: String(total), score: String(score), qNum: String(Math.min(s.step, total - 1) + 1), q, opts, steps, cases,
      inQuiz: !finished, finished, answered, notAnswered: !answered,
      fbTitle: correct ? 'Correct' : 'Not quite',
      fbStyle: `padding:14px 16px;border-radius:10px;${correct ? 'background:var(--storage-soft);color:var(--storage-text)' : 'background:var(--warn-soft);color:var(--warn-text)'}`,
      nextLabel: s.step === total - 1 ? 'See results' : 'Next step',
      next: () => this.setState({ step: this.state.step + 1, choice: null }),
      restart: () => this.setState({ step: 0, choice: null, answers: {} }),
      evidence: revealed, noEvidence: revealed.length === 0,
      verdict: score === total ? 'You followed the Doctor\'s reasoning at every step.' : 'Review the steps you missed in the full report, then try again.'
    };
  }
}
</script>
