  jump(stage) {
    const order = ['intake', 'triage', 'evidence', 'diagnosis', 'report', 'memory'];
    const i = order.indexOf(stage);
    const s = this.state;
    const patch = { stage, t: 0, paused: false, reached: Math.max(s.reached, i) };
    if (stage === 'triage') { patch.answered = false; patch.skippedAnswer = false; patch.pcMatch = ''; patch.pcPick = ''; }
    if (i >= 2 && Object.keys(s.launched).length === 0) patch.launched = { ...s.sel };
    if (stage === 'evidence') { patch.extra = {}; patch.asks = []; }
    if (stage === 'report') { patch.review = 'choosing'; patch.note = ''; }
    if (stage === 'memory') { patch.kb = ''; if (!s.decision) patch.decision = 'approved'; }
    this.setState(patch);
  }

    };
    const linkOf = f => ({ url: f.url, link: f.link, target: f.internal ? '_self' : '_blank' });
    const tabStyle = on => `min-height:32px;padding:0 10px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid ${on ? 'var(--accent-border)' : 'transparent'};background:${on ? 'var(--accent-soft)' : 'transparent'};color:${on ? 'var(--accent-text)' : 'var(--muted)'}`;
    let allFinds = [];
    const agents = d.sources.map(src => {
      const ex = s.extra[src.id];
      const sel = !!s.launched[src.id] || ex !== undefined;
      const start = ex !== undefined ? ex : src.offset;
      const rel = t - start;
      const done = sel && rel >= src.done;
      const status = !sel ? 'Not searched' : rel < 0 ? 'Queued' : done ? 'Done' : 'Searching';
      const finds = sel ? src.findings.map((f, i) => ({ ...f, fid: src.id + i })).filter(f => rel >= f.at) : [];
      finds.forEach(f => allFinds.push({ ...f, abs: start + f.at, src }));
      const pct = sel ? Math.max(0, Math.min(100, Math.round(rel / src.done * 100))) : 0;
      const onEv = s.cardTab[src.id] === 'evidence';
      const setTab = v => () => this.setState({ cardTab: { ...this.state.cardTab, [src.id]: v } });
      return {
        name: src.name, logo: this.logo(src.id),
        isLog: !onEv, isEv: onEv, logSel: onEv ? 'false' : 'true', evSel: onEv ? 'true' : 'false',
        showLog: setTab('log'), showEv: setTab('evidence'), logTabStyle: tabStyle(!onEv), evTabStyle: tabStyle(onEv),
        finds: finds.slice().reverse().map(f => ({ title: f.title, detail: f.detail, trust: f.trust, trustStyle: this.chip(trustKind[f.trust]), ...linkOf(f), ...pinBtn(f.fid) })),
        noFinds: finds.length === 0, desc: src.desc, skipReason: src.skipReason, sel, skipped: !sel, done, searching: sel && rel >= 0 && !done,
        status, statusStyle: this.chip(status === 'Done' ? 'teal' : status === 'Searching' ? 'blue' : 'gray'),
        lines: sel ? src.lines.filter(l => rel >= l.at).map(l => ({ text: l.text, ts: fmt(l.at) })) : [],
        findCount: finds.length,
        barStyle: `height:100%;width:${pct}%;background:${done ? 'var(--storage)' : 'var(--accent)'};transition:width .2s`,
        cardStyle: `background:var(--surface);border:1px solid ${src.store && sel ? 'var(--storage-border)' : 'var(--border)'};border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;${sel ? '' : 'background:var(--surface-2)'}`,
        runAnyway: () => this.setState({ extra: { ...this.state.extra, [src.id]: this.state.t + 4 } })
      };
    });
    const selAgents = agents.filter(a => a.sel);
    const doneCount = selAgents.filter(a => a.done).length;
    const allDone = selAgents.length > 0 && doneCount === selAgents.length;
    allFinds.sort((a, b) => b.abs - a.abs);
    const pinCount = Object.values(s.pins).filter(Boolean).length;
    const feed = allFinds.map(f => ({
      logo: this.logo(f.src.id), srcName: f.src.name, time: fmt(f.abs), title: f.title, detail: f.detail, trust: f.trust,
      trustStyle: this.chip(trustKind[f.trust]), ...linkOf(f), ...pinBtn(f.fid), pinned: !!s.pins[f.fid]
    }));
    const feedPinned = feed.filter(f => f.pinned), feedRest = feed.filter(f => !f.pinned);
    const totalFinds = s.stage === 'evidence' ? allFinds.length : d.sources.filter(x => s.launched[x.id] || s.extra[x.id] !== undefined).reduce((n, x) => n + x.findings.length, 0);
    const ev = {
      doneCount, selCount: selAgents.length || Object.values(s.launched).filter(Boolean).length, findCount: totalFinds, pinCount,
      notDone: !allDone, feedEmpty: feed.length === 0, hasPinned: feedPinned.length > 0,
      wide: s.feedWide, narrow: !s.feedWide, wideExpanded: s.feedWide ? 'true' : 'false',
      wideLabel: s.feedWide ? 'Collapse evidence feed' : 'Expand evidence feed to 2 columns',
      toggleWide: () => this.setState({ feedWide: !this.state.feedWide }),
      gridStyle: `flex:${s.feedWide ? '1 1 280px' : '999 1 600px'};min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px`,
      feedStyle: `flex:${s.feedWide ? '999 1 692px' : '1 1 340px'};min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column`,
      barStyle: `height:100%;width:${selAgents.length ? Math.round(doneCount / selAgents.length * 100) : 0}%;background:var(--accent);transition:width .3s`
    };
    const askChips = d.sources.filter(x => s.launched[x.id] || s.extra[x.id] !== undefined).map(x => {
      const on = s.askSrc === x.id;
      return { handle: x.name.split(' ')[0], pressed: on ? 'true' : 'false', pick: () => this.setState({ askSrc: x.id }),
        style: `min-height:32px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid ${on ? 'var(--accent)' : 'var(--border-strong)'};background:${on ? 'var(--accent-soft)' : 'var(--surface)'};color:${on ? 'var(--accent-text)' : 'var(--muted)'}` };
    });
    const asks = s.asks.map(q => ({ ...q, pending: t < q.at + 40, ready: t >= q.at + 40 }));
    const sendAsk = () => {
      const txt = this.state.askText.trim();
      if (!txt) return;
      const src = d.sources.find(x => x.id === this.state.askSrc) || d.sources[7];
      this.setState({ askText: '', asks: [...this.state.asks, { srcName: src.name, q: txt, at: this.state.t, reply: d.replies[src.id] }] });
    };

    // Tier 2
    let cur = 8;
    const meta = {
      doctor: { name: 'Diagnostic Doctor', model: '', mono: 'DD', bg: 'background:var(--accent);color:var(--on-accent)' },
      source: { name: 'Mosaic Customer Data', model: 'follow-up', mono: 'MO', bg: 'background:var(--agent-tile);color:var(--accent-text)' },
      skill: { name: 'Skill', model: 'run by the Doctor', mono: 'SK', bg: 'background:var(--skill);color:var(--on-accent)' },
      reviewer: { name: 'Second-opinion Reviewer', model: 'fresh context', mono: 'SR', bg: 'background:var(--ink);color:var(--on-accent)' }
    };
    const segTimes = {};
    const allSegs = d.segs.map(g => {
      const ty = this.typed(g.text, cur, 4);
      segTimes[g.id] = { st: cur, end: ty.end };
      cur = ty.end + (g.kind === 'round' ? 6 : 16);
      const m = meta[g.kind] || {};
      return { isSystem: g.kind === 'round', isMsg: g.kind !== 'round', visible: t >= segTimes[g.id].st, text: g.kind === 'round' ? g.text : ty.text, typing: ty.typing,
        name: g.name || m.name, model: m.model, mono: m.mono, tileStyle: `flex:none;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;${m.bg}` };
    });
    const segs = allSegs.filter(g => g.visible);
    const isDone = id => t >= segTimes[id].end;
    const isOn = id => t >= segTimes[id].st;
    const supDone = isDone('sup');
    const hDef = [
      { id: 'H1', title: 'Records over the 100 KB size limit', final: supDone ? ['Supported', 'blue', 92] : null },
      { id: 'H2', title: 'Operations quota throttling', final: isDone('h2') ? ['Ruled out', 'gray', 6] : null },
      { id: 'H3', title: 'Client v5.2.0 hides batch errors', final: supDone ? ['Contributing', 'violet', 78] : null }
    ];
    const hyps = hDef.map(h => {
      const f = h.final || ['Testing', 'amber', 40];
      const out = f[0] === 'Ruled out';
      return { id: h.id, title: h.title, label: f[0], chipStyle: this.chip(f[1]),
        titleStyle: `font-size:13px;min-width:0;${out ? 'text-decoration:line-through;color:var(--muted)' : ''}`,
        barStyle: `height:100%;width:${f[2]}%;transition:width .4s;background:${f[0] === 'Supported' ? 'var(--accent)' : f[0] === 'Contributing' ? 'var(--skill)' : f[0] === 'Testing' ? 'var(--warn)' : 'var(--border-strong)'}` };
    });
    const skillDefs = [['compare', 'Compare & Reconcile Findings', 'Ranks sources by trust and recency, flags conflicts'], ['verify', 'Verify Facts & Links', 'Checks links work, ticket IDs exist, quotes match'], ['next', 'Suggest Next Steps', 'Actions for you and the customer']];
    const skills = skillDefs.map(([id, name, desc]) => {
      const st = isDone(id) ? 'Done' : isOn(id) ? 'Running' : 'Waiting';
      return { name, desc, status: st, chipStyle: this.chip(st === 'Done' ? 'teal' : st === 'Running' ? 'violet' : 'gray') };
    });
    let verdict = 'Waiting', vk = 'gray';
    if (isOn('rv1')) { verdict = 'Reviewing'; vk = 'blue'; }
    if (isDone('rv1')) { verdict = 'Challenged'; vk = 'amber'; }
    if (isDone('rv2')) { verdict = 'Upheld'; vk = 'teal'; }
    const diag = {
      hypReady: isOn('hyp') && t > segTimes.hyp.st + 30, hypPending: !(isOn('hyp') && t > segTimes.hyp.st + 30),
      hunchShown: isDone('h2') && !!s.form.hunch.trim(), verdict, verdictStyle: this.chip(vk),
      rounds: isOn('r1q') ? 1 : 0, extra: isOn('r2q') ? 1 : 0, notDone: !isDone('rv2')
    };

    // Tier 3
    let rc = 8;
    const sections = d.sections.map(sec => {
      const ty = this.typed(sec.text, rc, 7);
      rc = ty.end + 6;
      return { h: sec.h, text: ty.text, started: ty.started, typing: ty.typing };
    });
    const reportDone = t >= rc;
    const rv = { choosing: s.review === 'choosing', correcting: s.review === 'correcting', rejecting: s.review === 'rejecting', notReady: !reportDone };

    // Memory
    const approvedLike = s.decision !== 'rejected';
    const k1 = this.typed(d.K1, 10, 4);
    const k2 = this.typed(d.K2, k1.end + 14, 4);
    const kbDoneText = { create: 'Draft created and linked to the case record. Assigned to you for review.', update: 'Update suggestion added to "What is the size limit for records?" and linked to the case.', skip: 'Marked as not needed. Logged on the case record.' }[s.kb] || '';
    const mem = {
      approvedLike, rejected: !approvedLike,
      banner: s.decision === 'rejected' ? 'Report rejected' : s.decision === 'corrected' ? 'Approved with corrections' : 'Diagnosis approved',
      bannerSub: s.decision === 'rejected' ? 'Saved to the library as rejected, with your reason. Not added to Past Solved Cases.' : 'Saved to the library, added to Past Solved Cases, KB gap check running.',
      bannerStyle: `display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;padding:14px 20px;border-radius:12px;${s.decision === 'rejected' ? 'background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger-border)' : 'background:var(--storage-soft);color:var(--storage-text);border:1px solid var(--storage-border)'}`,
      libStatus: s.decision === 'rejected' ? 'rejected' : s.decision === 'corrected' ? 'approved, with your correction' : 'approved',
      storeLabel: approvedLike ? 'Provisional' : 'Not added', storeChip: this.chip(approvedLike ? 'amber' : 'gray'),
      storeText: approvedLike ? `Marked provisional. Confirmed once ticket #${s.form.ticket} closes without reopening. Feeds Past Solved Cases Search on future tickets.` : 'Only approved reports are stored, so future searches never learn from a rejected diagnosis.',
      kbLabel: !approvedLike ? 'Skipped' : k2.done ? 'Partial match' : 'Searching', kbChip: this.chip(!approvedLike ? 'gray' : k2.done ? 'amber' : 'blue'),
      k1: k1.text, k1typing: k1.typing || !k1.started, k2: k2.text, k2started: k2.started, k2gap: '\n', k2typing: k2.typing,
      showDraft: approvedLike && k2.done, kbOpen: !s.kb, kbDone: !!s.kb, kbDoneText
    };

    // Header
    const labels = { intake: 'Draft', triage: used ? 'Resolved from past case' : 'Triage', evidence: 'Gathering evidence', diagnosis: 'Diagnosing', report: reportDone ? 'Awaiting your review' : 'Writing report', memory: mem.banner };
    const kinds = { intake: 'gray', triage: used ? 'teal' : 'blue', evidence: 'blue', diagnosis: 'violet', report: reportDone ? 'amber' : 'blue', memory: s.decision === 'rejected' ? 'red' : 'teal' };
    let active = 0;
    if (s.stage === 'triage') active = showPlan || used ? 0 : 1;
    if (s.stage === 'evidence') active = agents.filter(a => a.searching).length;
    if (s.stage === 'diagnosis') active = diag.notDone ? (isOn('rv1') ? 2 : 1) : 0;
    if (s.stage === 'report') active = reportDone ? 0 : 1;
    if (s.stage === 'memory') active = approvedLike && !k2.done ? 1 : 0;
    const secs = Math.floor(s.clock * 0.05);

    return {
      ...this.themeVals(),
      form: s.form, fh, connectors, tiers, steps,
      isIntake: s.stage === 'intake', isTriage: s.stage === 'triage', isEvidence: s.stage === 'evidence',
      isDiagnosis: s.stage === 'diagnosis', isReport: s.stage === 'report', isMemory: s.stage === 'memory',
      statusLabel: labels[s.stage], statusStyle: this.chip(kinds[s.stage]),
      showRun: s.stage !== 'intake', elapsed: String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'),
      activeAgents: String(active), pauseLabel: s.paused ? 'Resume' : 'Pause',
      togglePause: () => this.setState({ paused: !this.state.paused }),
      skip: () => this.setState({ t: this.state.t + 2000 }),
      newCase: () => { const init = this.initial(); this.setState({ ...init, form: this.state.form, theme: this.state.theme }); },
      startInvestigation: () => this.setState({ stage: 'triage', t: 0, clock: 0, reached: Math.max(this.state.reached, 1), answered: false, pcMatch: '', pcPick: '', launched: {}, pins: {}, decision: '' }),
      tri, pc, tz: s.tz, client: s.client, answered: s.answered,
      answerText: s.skippedAnswer ? 'Continue without these details.' : `14:00 is ${s.tz}. Client: ${s.client}.`,
      onTz: e => this.setState({ tz: e.target.value }), onClient: e => this.setState({ client: e.target.value }),
      answer: () => this.setState({ answered: true, skippedAnswer: false, t2: this.state.t + 8 }),
      skipAnswer: () => this.setState({ answered: true, skippedAnswer: true, t2: this.state.t + 8 }),
      plan, selCount: String(selCount),
      launch: () => this.setState({ stage: 'evidence', t: 0, launched: { ...this.state.sel }, extra: {}, asks: [], reached: Math.max(this.state.reached, 2) }),
      agents: [...agents.filter(x => x.sel), ...agents.filter(x => !x.sel)], feed, feedPinned, feedRest, ev, askChips, asks, askText: s.askText, sendAsk,
      onAsk: e => this.setState({ askText: e.target.value }),
      askKey: e => { if (e.key === 'Enter') sendAsk(); },
      toDoctor: () => this.setState({ stage: 'diagnosis', t: 0, reached: Math.max(this.state.reached, 3) }),
      segs, hyps, skills, diag,
      toReport: () => this.setState({ stage: 'report', t: 0, review: 'choosing', reached: Math.max(this.state.reached, 4) }),
      sections, rv, note: s.note, onNote: e => this.setState({ note: e.target.value }),
      approve: () => this.setState({ decision: 'approved', stage: 'memory', t: 0, kb: '', reached: 5 }),
      startCorrect: () => this.setState({ review: 'correcting' }),
      startReject: () => this.setState({ review: 'rejecting' }),
      cancelReview: () => this.setState({ review: 'choosing' }),
      saveCorrect: () => this.setState({ decision: 'corrected', stage: 'memory', t: 0, kb: '', reached: 5 }),
      confirmReject: () => this.setState({ decision: 'rejected', stage: 'memory', t: 0, kb: '', reached: 5 }),
      mem, kbTitle: s.kbTitle, onKbTitle: e => this.setState({ kbTitle: e.target.value }),
      kbCreate: () => this.setState({ kb: 'create' }), kbUpdate: () => this.setState({ kb: 'update' }), kbSkip: () => this.setState({ kb: 'skip' })
    };
  }
}
</script>
